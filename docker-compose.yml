services:
  quill-8.1:
    build:
      context: .
      dockerfile: resources/docker/Dockerfile
      args:
        PHP_VERSION: "8.1"
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: quill-8.1
    hostname: quill-8.1
    working_dir: /srv
    volumes:
      - .:/srv
      # Read-only so the reader and the byte-for-byte gate can reach cphalcon's
      # .zep sources without copying them in.
      - ../cphalcon:/cphalcon:ro
      - ../phalcon:/phalcon:ro
    command: tail -f /dev/null

  quill-8.5:
    build:
      context: .
      dockerfile: resources/docker/Dockerfile
      args:
        PHP_VERSION: "8.5"
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: quill-8.5
    hostname: quill-8.5
    working_dir: /srv
    volumes:
      - .:/srv
      - ../cphalcon:/cphalcon:ro
      - ../phalcon:/phalcon:ro
    command: tail -f /dev/null
